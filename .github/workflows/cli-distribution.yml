name: CLI distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test src/cli/cli.integration.test.ts
  unsupported-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:cli
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          if npm install --global --engine-strict --offline --no-audit --no-fund --prefix "$RUNNER_TEMP/npm-prefix" ./dist/confluence-sync-cli.tgz > "$RUNNER_TEMP/engine.log" 2>&1; then
            echo 'Unsupported Node installation unexpectedly succeeded'
            exit 1
          fi
          rg EBADENGINE "$RUNNER_TEMP/engine.log"
